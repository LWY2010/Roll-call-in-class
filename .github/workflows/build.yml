name: Build EXE

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5           # ← v4 改成 v5

      - name: Setup Python
        uses: actions/setup-python@v6       # ← v5 改成 v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 openpyxl pyinstaller

      - name: Build rollcall
        run: |
          pyinstaller -F -w -n "课堂点名" rollcall.py

      - name: Build reset tool
        run: |
          pyinstaller -F -n "密码重置" reset_password.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: exe-package
          path: |
            dist/课堂点名.exe
            dist/密码重置.exe
          if-no-files-found: error
