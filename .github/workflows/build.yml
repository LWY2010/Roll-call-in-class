@echo off
chcp 65001 >nul
where python >nul 2>nul
if errorlevel 1 (echo 请先装 Python & pause & exit /b 1)

echo 安装依赖...
python -m pip install --upgrade pip -q
python -m pip install PySide6 openpyxl pyinstaller -i https://pypi.tuna.tsinghua.edu.cn/simple

echo 打包主程序...
python -m PyInstaller -F -w -n "课堂点名" rollcall.py --clean --noconfirm

echo 打包密码重置工具...
python -m PyInstaller -F -n "密码重置" reset_password.py --clean --noconfirm

echo.
if exist "dist\课堂点名.exe" (
    echo ✅ 打包完成！文件在 dist 文件夹
    explorer dist
) else (
    echo ❌ 打包失败
)
pause
