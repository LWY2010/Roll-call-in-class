@echo off
chcp 65001 >nul
where python >nul 2>nul
if errorlevel 1 (echo 请先装 Python & pause & exit /b 1)

echo 安装依赖...
python -m pip install --upgrade pip -q
python -m pip install PySide6 openpyxl pyinstaller -q

echo 打包中...
python -m PyInstaller -F -w -n "课堂点名" rollcall.py

if exist "dist\课堂点名.exe" (
    echo 成功：dist\课堂点名.exe
    explorer dist
) else (
    echo 失败
)
pause
